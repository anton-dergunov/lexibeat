[project]
name = "lexibeat"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kokoro>=0.9.4",
    "librosa>=1.0.0",
    "mlx-audio>=0.5.0",
    "numpy>=2.5.2",
    "pedalboard>=0.9.24",
    "pyloudnorm>=0.2.0",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
experimental-tts = [
    "mlx-tada>=0.1.0",
    "psutil>=7.0.0",
]
hosted-tts = [
    "google-genai>=2.19.0",
    "requests>=2.32.0",
]
