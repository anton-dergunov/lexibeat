[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lexibeat"
version = "0.3.0"
description = "Reproducible procedural music beds and spoken vocabulary loops."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "NOTICE.md" }
authors = [{ name = "Anton Dergunov" }]
keywords = ["audio", "procedural-music", "language-learning", "tts"]

# The slim runtime. librosa is deliberately not here: the music path used it for `resample`
# alone, and through it pulled numba and llvmlite and most of a 534 MB environment into an image
# whose job is to render a bed and mix speech it did not synthesise. soxr does that arithmetic
# directly, and librosa is now an extra of the local voice backends that genuinely want it.
dependencies = [
    "numpy>=2.5.2",
    "pedalboard>=0.9.24",
    "pyloudnorm>=0.2.0",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "soxr>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/anton-dergunov/lexibeat"
Source = "https://github.com/anton-dergunov/lexibeat"

[project.optional-dependencies]
# The versioned HTTP surface a host integrates against. No gradio: the loop service is not the Lab.
service = [
    "fastapi>=0.116.0,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.35.0,<1",
]
# The Lab: bed exploration, validation and preview rendering.
explorer = [
    "fastapi>=0.116.0,<1",
    "gradio>=6.0.0,<7",
    "httpx>=0.28.0,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.35.0,<1",
]
local-tts = [
    "kokoro>=0.9.4",
    "librosa>=1.0.0",
    "mlx-audio>=0.5.0",
]
experimental-tts = [
    "mlx-tada>=0.1.0",
    "psutil>=7.0.0",
]
hosted-tts = [
    "google-genai>=2.19.0",
    "requests>=2.32.0",
]
video-demo = [
    "Pillow>=11.0.0",
]

[project.scripts]
lexibeat = "lexibeat.cli:main"
lexibeat-bundle = "lexibeat.bundle:main"
lexibeat-service = "lexibeat.service:main"
lexibeat-explorer = "lexibeat.explorer_web:main"

[tool.hatch.build.targets.wheel]
packages = ["lexibeat"]

# The 1.8 GB sample bundle never rides the wheel: it is fetched once into a volume and named by
# LEXIBEAT_BUNDLE_ROOT. `lexibeat-bundle publish` packs it for a release instead.
[tool.hatch.build.targets.sdist]
include = ["lexibeat", "tests", "docs", "examples", "README.md", "NOTICE.md", "AGENTS.md"]
