name: Release

# A tag builds the wheel and writes SHA256SUMS, because a host pins this project by version and
# verifies what it downloads against the release's own digests.
#
# The suite runs first, from the *same* definition a pull request uses rather than a second copy of
# it: publishing artifacts built from a tree nobody tested is the failure this guards against, and
# two drifting copies of the test job is the failure the reuse guards against.
#
# The 3.1 GB sample bundle is deliberately not built here: it is Git-LFS tracked, so a runner would
# have to pull the whole of it to repack it. It is published from a workstation instead:
#
#     lexibeat-bundle publish --out dist/bundle
#     gh release upload "$TAG" dist/bundle/*.tar.[0-9][0-9][0-9]
#
# Not its SHA256SUMS: the job below attaches one for the wheel under that name, and a host pins the
# bundle's digest inline anyway.
# It is written as numbered parts under 1.9 GiB because a release asset must be under 2 GiB, and
# the bundle is larger. The digest publish prints is the whole archive's, and is what a host pins.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build and attach artifacts to
        required: true

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # The wheel carries no audio, so this job needs none of it.
          lfs: false
          ref: ${{ inputs.tag || github.ref }}

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: The tag and the package version agree
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match version $version in pyproject.toml." >&2
            exit 1
          fi

      - name: Build the wheel and the source distribution
        run: uv build --out-dir dist

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum ./*.whl ./*.tar.gz | sed 's|\./||' > SHA256SUMS
          cat SHA256SUMS

      - name: Attach the artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --generate-notes
          gh release upload "$tag" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --clobber
